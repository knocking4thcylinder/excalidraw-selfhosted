# Baked into the app image (Dockerfile, Dockerfile.runtime). Caddy proxies
# https://$FQDN:8443/ to this server on localhost:3000.
server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;

    location / {
        index index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Service workers must be revalidated so app updates reach clients.
    location ~ ^/(sw|service-worker)\.js$ {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
